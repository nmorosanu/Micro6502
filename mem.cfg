MEMORY {
    RAM:
        start   =   $0000
        size    =   $8000
        type    =   RW
        file    =   "build/bin/ram.bin";

    ROM:
        start   =   $8000
        size    =   $8000
        type    =   RO
        file    =   "build/bin/firmware.bin";

    PROGRAM:
        start   =   $2000
        size    =   $6000
        type    =   RW
        file    =   "build/bin/program.bin";
}

SEGMENTS {
    CODE:
        load    =   ROM
        type    =   RO
        start   =   $8040;
    RODATA:
        load    =   ROM
        type    =   RO;
    DATA:
        load    =   RAM
        type    =   RW;
    BSS:
        load    =   RAM
        type    =   RW;
    VECTORS:   
        load    =   ROM
        type    =   RO
        start   =   $FFFA;
}
